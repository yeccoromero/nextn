<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#333" stroke-width="1"/>
    </pattern>
    <pattern id="gridSmall" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#222" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#111"/>
  <rect width="100%" height="100%" fill="url(#gridSmall)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <!-- Center cross -->
  <line x1="400" y1="0" x2="400" y2="450" stroke="#555" stroke-width="1"/>
  <line x1="0" y1="225" x2="800" y2="225" stroke="#555" stroke-width="1"/>
  <!-- Labels -->
  <text x="10" y="20" fill="#666" font-size="12" font-family="monospace">800×450 Grid</text>
  <text x="390" y="240" fill="#60a5fa" font-size="10" font-family="monospace">center</text>
  <!-- Test shape -->
  <rect x="200" y="100" width="400" height="250" rx="10" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <text x="380" y="230" fill="#60a5fa" font-size="16" font-family="sans-serif" font-weight="bold">BEND IT</text>
</svg>
